<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="timberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5804f" />
      <stop offset="50%" stop-color="#804f35" />
      <stop offset="100%" stop-color="#573729" />
    </linearGradient>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e8f6c" />
      <stop offset="100%" stop-color="#1d3d30" />
    </linearGradient>
  </defs>

  <!-- Isotipo: Anillos de madera + Hojas tropicales + Dientes de corte industrial -->
  <g transform="translate(15, 12)">
    <!-- Base de disco/tronco -->
    <circle cx="38" cy="38" r="34" fill="url(#timberGrad)" />
    <circle cx="38" cy="38" r="26" fill="none" stroke="#f4ece0" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 4" />
    <circle cx="38" cy="38" r="18" fill="none" stroke="#f4ece0" stroke-width="2" opacity="0.5" />
    <circle cx="38" cy="38" r="9" fill="#321d15" />
    
    <!-- Hoja tropical / brote de selva de Tabasco -->
    <path d="M38,10 C50,22 55,38 38,55 C22,38 27,22 38,10 Z" fill="url(#forestGrad)" opacity="0.9" />
    <path d="M38,15 L38,48" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" />
    
    <!-- Acento dorado de precisión -->
    <circle cx="38" cy="38" r="3" fill="#fbbf24" />
  </g>

  <!-- Tipografía del Logotipo -->
  <g transform="translate(95, 20)">
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28" fill="#573729" letter-spacing="1">
      MADERAS
    </text>
    <text x="145" y="32" font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28" fill="#2e7255" letter-spacing="1">
      LA CHOCA
    </text>
    <text x="2" y="52" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="11" fill="#9e6740" letter-spacing="3.5">
      ERP / CRM • VILLAHERMOSA, TABASCO
    </text>
    <line x1="2" y1="58" x2="275" y2="58" stroke="#b5804f" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>
